[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-governance"
version = "0.1.0"
description = "Vendor-neutral access governance for humans, service accounts and AI agents: deterministic SoD engine, per-hop policy gateway and tamper-evident evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Satish Negi" }]
keywords = ["access-governance", "sod", "segregation-of-duties", "ai-agents", "cedar", "mcp", "iam", "grc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cedarpy>=4.1,<5",
  "cryptography>=42",
  "fastapi>=0.110",
  "pydantic>=2.6,<3",
  "pyjwt[crypto]>=2.8,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29"]

[project.scripts]
agent-governance = "agent_governance.cli:main"

[project.urls]
Homepage = "https://github.com/snegi26/AgentGovernance"
Issues = "https://github.com/snegi26/AgentGovernance/issues"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_governance"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "C4", "RET", "TID"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "S101",  # asserts are fine in tests and for internal invariants checked by mypy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "PLC0415"]

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.11"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cedarpy", "cedarpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["perf: latency gate tests (in-process benchmarks)"]

[tool.coverage.run]
source = ["agent_governance"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
